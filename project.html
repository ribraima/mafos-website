<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project — Mafos Design</title>
  <meta name="description" content="A project by Mafos Design: logos, photography, portraits and interiors for businesses in Albania.">
  <meta name="theme-color" content="#ffd54f">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="project">
  <a class="skip-link" href="#main" data-i18n="a11y.skip">Skip to work</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="Mafos Design">
        <span class="brand-name" data-brand-name>Mafos</span>
        <span class="brand-sub" data-brand-sub>Design</span>
      </a>
      <nav class="site-nav" id="site-nav">
        <a href="index.html#work" data-i18n="nav.work">Work</a>
        <a href="index.html#packages" data-i18n="nav.packages">Packages</a>
        <a href="index.html#about" data-i18n="nav.about">About</a>
        <a href="index.html#contact" data-i18n="nav.contact">Contact</a>
      </nav>
      <div class="header-tools">
        <div class="lang-switch" data-lang-switch></div>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Menu" data-i18n-aria="nav.menu">
          <span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="project">
    <div class="container" data-project></div>
  </main>

  <dialog class="lightbox" data-lightbox aria-label="Image viewer" data-i18n-aria="lightbox.label">
    <img class="lightbox-image" alt="">
    <button type="button" class="lightbox-btn lightbox-close" data-lightbox-close aria-label="Close" data-i18n-aria="lightbox.close">×</button>
    <button type="button" class="lightbox-btn lightbox-prev" data-lightbox-prev aria-label="Previous image" data-i18n-aria="lightbox.prev">←</button>
    <button type="button" class="lightbox-btn lightbox-next" data-lightbox-next aria-label="Next image" data-i18n-aria="lightbox.next">→</button>
    <p class="lightbox-count" aria-live="polite"></p>
  </dialog>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© <span data-year>2026</span> <span data-brand-name>Mafos</span> <span data-brand-sub>Design</span>. <span data-i18n="footer.rights">All rights reserved.</span></span>
      <a href="index.html#contact" data-link="instagram" target="_blank" rel="noopener">Instagram</a>
    </div>
  </footer>

  <script src="content/content.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
