# Publishes the website to GitHub Pages on every push to main.
# The content check runs first; if it fails, the live site stays as it was.
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Check content
        run: node scripts/check-content.js

      - name: Collect the site files
        run: |
          mkdir _site
          cp -r index.html project.html assets content images _site/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
