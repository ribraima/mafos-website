# Publishes the website on every push to main:
#   https://mafos.pages.dev (Cloudflare Pages, main address)
#   https://ribraima.github.io/mafos-website/ (GitHub Pages, backup)
# The content check runs first; if it fails, nothing is published.
# Cloudflare needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets.
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Check content
        run: node scripts/check-content.js

      - name: Collect the site files
        run: |
          mkdir _site
          cp -r index.html project.html assets content images _site/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Publish to Cloudflare Pages (mafos.pages.dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project list | grep -qw mafos \
            || npx --yes wrangler@4 pages project create mafos --production-branch main
          npx --yes wrangler@4 pages deploy _site --project-name mafos --branch main --commit-dirty=true
